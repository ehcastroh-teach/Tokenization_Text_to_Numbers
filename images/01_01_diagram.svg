<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'SF Pro Text', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="960" height="700" fill="#FAFAF9"/>
  <rect x="40" y="28" width="6" height="34" fill="#F59E0B"/>
  <text x="58" y="46" font-size="22" fill="#1A1A1A" font-weight="600">Three ways to cut a sentence</text>
  <text x="58" y="66" font-size="13" fill="#6B7280">The same sentence as characters, words and tokens</text>
  <rect x="10" y="90" width="940" height="590" rx="14" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="395.0" y="78" width="170" height="24" rx="6" fill="#1A1A1A"/>
  <text x="480.0" y="95" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">Sequence Length</text>
  <rect x="370" y="130" width="220" height="120" rx="12" fill="#2D3748" fill-opacity="0.08" stroke="#2D3748" stroke-width="1.5"/>
  <text x="480" y="160" font-size="13" fill="#2D3748" font-weight="600" text-anchor="middle">Characters</text>
  <rect x="394" y="178" width="172" height="14" rx="4" fill="#2D3748" fill-opacity="0.12"/>
  <rect x="394" y="178" width="172.0" height="14" rx="4" fill="#2D3748"/>
  <text x="480" y="222" font-size="12" fill="#2D3748" font-weight="600" text-anchor="middle">215 pieces</text>
  <rect x="370" y="270" width="220" height="120" rx="12" fill="#4C51BF" fill-opacity="0.08" stroke="#4C51BF" stroke-width="1.5"/>
  <text x="480" y="300" font-size="13" fill="#4C51BF" font-weight="600" text-anchor="middle">Words</text>
  <rect x="394" y="318" width="172" height="14" rx="4" fill="#4C51BF" fill-opacity="0.12"/>
  <rect x="394" y="318" width="32.0" height="14" rx="4" fill="#4C51BF"/>
  <text x="480" y="362" font-size="12" fill="#4C51BF" font-weight="600" text-anchor="middle">40 pieces</text>
  <rect x="370" y="410" width="220" height="120" rx="12" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="440" font-size="13" fill="#059669" font-weight="600" text-anchor="middle">Tokens</text>
  <rect x="394" y="458" width="172" height="14" rx="4" fill="#059669" fill-opacity="0.12"/>
  <rect x="394" y="458" width="71.2" height="14" rx="4" fill="#059669"/>
  <text x="480" y="502" font-size="12" fill="#059669" font-weight="600" text-anchor="middle">89 pieces after 200 merges</text>
  <text x="480" y="548" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">bar length = number of pieces (to scale)</text>
  <g>
    <circle cx="320" cy="150" r="15" fill="#2D3748"/>
    <text x="320" y="155" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
    <line x1="335" y1="150" x2="368" y2="190" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="30" y="130" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="48" y="156" font-size="13" fill="#2D3748" font-weight="600">Characters: long</text>
    <text x="48" y="178" font-size="11" fill="#374151">Sequence is long (215 pieces)</text>
    <text x="48" y="196" font-size="11" fill="#374151">Vocabulary stays tiny</text>
  </g>
  <g>
    <circle cx="640" cy="290" r="15" fill="#4C51BF"/>
    <text x="640" y="295" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
    <line x1="625" y1="290" x2="592" y2="330" stroke="#4C51BF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="660" y="270" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="678" y="296" font-size="13" fill="#4C51BF" font-weight="600">Words: unbounded</text>
    <text x="678" y="318" font-size="11" fill="#374151">Sequence is short (40 pieces)</text>
    <text x="678" y="336" font-size="11" fill="#374151">Vocabulary grows without bound</text>
  </g>
  <g>
    <circle cx="320" cy="430" r="15" fill="#059669"/>
    <text x="320" y="435" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
    <line x1="335" y1="430" x2="368" y2="470" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="30" y="410" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="48" y="436" font-size="13" fill="#059669" font-weight="600">Tokens: the compromise</text>
    <text x="48" y="458" font-size="11" fill="#374151">89 pieces after 200 merges</text>
    <text x="48" y="476" font-size="11" fill="#374151">Short enough to read, small enough to list</text>
  </g>
  <rect x="60" y="580" width="840" height="76" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/>
  <text x="80" y="604" font-size="12" fill="#92400E" font-weight="600">Why tokens</text>
  <text x="80" y="624" font-size="11" fill="#78350F">Cut finer and the sequence gets long. Cut coarser and the vocabulary has no ceiling.</text>
  <text x="80" y="640" font-size="11" fill="#78350F">A tokenizer picks a point between the two, and BPE finds it by merging.</text>

</svg>
