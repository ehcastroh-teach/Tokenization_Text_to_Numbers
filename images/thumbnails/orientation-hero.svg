    <text x="210" y="29" font-size="14" fill="#F1F5F9" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">Tokenization isn't magic.</text>
    <line x1="210" y1="46" x2="210" y2="80" stroke="#F59E0B" stroke-width="2"/>
