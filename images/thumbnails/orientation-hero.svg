    <text x="210" y="105" font-size="14" fill="#E0E7FF" font-weight="700" text-anchor="middle">TOKENIZER</text>
    <text x="210" y="122" font-size="10" fill="#A5B4FC" text-anchor="middle">text in, pieces out</text>
