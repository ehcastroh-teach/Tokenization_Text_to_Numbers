    <rect x="86.0" y="164" width="78" height="34" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="125.0" y="186" font-size="11" fill="#D1FAE5" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">ization</text>
    <rect x="172.0" y="164" width="56" height="34" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="200.0" y="186" font-size="11" fill="#D1FAE5" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">isn</text>
    <rect x="236.0" y="164" width="44" height="34" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="258.0" y="186" font-size="11" fill="#D1FAE5" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">'t</text>
    <rect x="288.0" y="164" width="72" height="34" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="324.0" y="186" font-size="11" fill="#D1FAE5" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">magic</text>
    <rect x="368.0" y="164" width="34" height="34" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="385.0" y="186" font-size="11" fill="#D1FAE5" font-weight="600" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">.</text>
    <line x1="48.0" y1="198" x2="48.0" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="18.0" y="226" width="60" height="34" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="48.0" y="248" font-size="13" fill="#FEF3C7" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">#</text>
    <line x1="125.0" y1="198" x2="125.0" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="86.0" y="226" width="78" height="34" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="125.0" y="248" font-size="13" fill="#FEF3C7" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">#</text>
    <line x1="200.0" y1="198" x2="200.0" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="172.0" y="226" width="56" height="34" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="200.0" y="248" font-size="13" fill="#FEF3C7" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">#</text>
    <line x1="258.0" y1="198" x2="258.0" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="236.0" y="226" width="44" height="34" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="258.0" y="248" font-size="13" fill="#FEF3C7" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">#</text>
    <line x1="324.0" y1="198" x2="324.0" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="288.0" y="226" width="72" height="34" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="324.0" y="248" font-size="13" fill="#FEF3C7" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">#</text>
    <line x1="385.0" y1="198" x2="385.0" y2="226" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="368.0" y="226" width="34" height="34" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="385.0" y="248" font-size="13" fill="#FEF3C7" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">#</text>
    <text x="210" y="282" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">one integer id per piece</text>
    <line x1="210" y1="292" x2="210" y2="310" stroke="#A78BFA" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="110" y="310" width="200" height="52" rx="26" fill="#4C1D95" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="210" y="334" font-size="13" fill="#EDE9FE" font-weight="700" text-anchor="middle">Language model</text>
    <text x="210" y="351" font-size="10" fill="#C4B5FD" text-anchor="middle">reads numbers, never text</text>
  </g>
  <g>
    <rect x="80" y="446" width="180" height="20" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="170" y="460" text-anchor="middle" font-size="11" font-weight="600" fill="#F59E0B">ehcastroh-teach · applied AI</text>
