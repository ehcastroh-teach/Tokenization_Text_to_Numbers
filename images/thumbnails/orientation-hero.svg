<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B46C1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6B46C1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <circle cx="900" cy="240" r="280" fill="url(#glow)"/>
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>
  <g>
    <text x="80" y="140" font-size="16" font-weight="500" fill="#F59E0B" letter-spacing="4">A TEACHING REPOSITORY</text>
    <text x="80" y="210" font-size="64" font-weight="700" fill="#FFFFFF">Tokenization:</text>
    <text x="80" y="278" font-size="64" font-weight="700" fill="#FFFFFF">text to <tspan fill="url(#accent)">numbers</tspan></text>
    <text x="80" y="326" font-size="22" fill="#CBD5E1">From a hand-built encoder to three real tokenizers</text>
    <g font-size="12" font-weight="600">
      <rect x="80" y="360" width="90" height="26" rx="13" fill="#6B46C1" opacity="0.25" stroke="#6B46C1"/>
      <text x="125.0" y="378" text-anchor="middle" fill="#C4B5FD">Python</text>
      <rect x="180" y="360" width="90" height="26" rx="13" fill="#059669" opacity="0.25" stroke="#059669"/>
      <text x="225.0" y="378" text-anchor="middle" fill="#6EE7B7">BPE</text>
      <rect x="280" y="360" width="90" height="26" rx="13" fill="#0369A1" opacity="0.25" stroke="#0369A1"/>
      <text x="325.0" y="378" text-anchor="middle" fill="#7DD3FC">tiktoken</text>
      <rect x="380" y="360" width="119" height="26" rx="13" fill="#F59E0B" opacity="0.25" stroke="#F59E0B"/>
      <text x="439.5" y="378" text-anchor="middle" fill="#FCD34D">SentencePiece</text>
    </g>
    <text x="80" y="430" font-size="13" fill="#94A3B8" font-style="italic">2 notebooks · homework · no API keys needed</text>
  </g>
  <g transform="translate(720, 50)">
