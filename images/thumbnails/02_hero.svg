    <text x="0" y="34" font-size="22" fill="#F1F5F9" font-weight="600" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">Tokenization isn't magic.</text>
    <text x="0" y="100" font-size="13" fill="#C7D2FE" font-weight="700" text-anchor="start">cl100k_base</text>
    <text x="360" y="100" font-size="13" fill="#C7D2FE" font-weight="700" text-anchor="end">6 tokens</text>
    <rect x="0" y="110" width="58" height="30" rx="5" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="60" y="110" width="82" height="30" rx="5" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="144" y="110" width="46" height="30" rx="5" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
