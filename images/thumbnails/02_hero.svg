    <rect x="216" y="110" width="70" height="30" rx="5" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="288" y="110" width="10" height="30" rx="5" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
    <text x="0" y="180" font-size="13" fill="#6EE7B7" font-weight="700" text-anchor="start">GPT-2</text>
    <text x="360" y="180" font-size="13" fill="#6EE7B7" font-weight="700" text-anchor="end">6 tokens</text>
    <rect x="0" y="190" width="58" height="30" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <rect x="60" y="190" width="82" height="30" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <rect x="144" y="190" width="46" height="30" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <rect x="192" y="190" width="22" height="30" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <rect x="216" y="190" width="70" height="30" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <rect x="288" y="190" width="10" height="30" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="0" y="260" font-size="13" fill="#FCD34D" font-weight="700" text-anchor="start">SentencePiece (300 pieces)</text>
    <text x="360" y="260" font-size="13" fill="#FCD34D" font-weight="700" text-anchor="end">16 tokens</text>
    <rect x="0" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="19" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="38" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="57" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="76" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="95" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="114" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="133" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="152" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="171" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="190" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="209" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="228" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="247" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="266" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="285" y="270" width="17" height="30" rx="5" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="332" font-size="12" fill="#94A3B8" text-anchor="start" font-style="italic">Same text, different cuts, different costs.</text>
  </g>
  <g>
    <rect x="80" y="446" width="180" height="20" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="170" y="460" text-anchor="middle" font-size="11" font-weight="600" fill="#F59E0B">ehcastroh-teach · applied AI</text>
