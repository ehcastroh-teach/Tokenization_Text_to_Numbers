<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" font-family="'SF Pro Text', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="564" fill="#FAFAF9"/>
  <text x="450" y="40" font-size="22" fill="#1A1A1A" font-weight="600" text-anchor="middle">Which statistic for which decision</text>
  <text x="450" y="62" font-size="13" fill="#6B7280" text-anchor="middle">Tokens per input: mean, p95 and max answer different questions</text>
  <g>
    <rect x="290" y="90" width="320" height="84" rx="10" fill="#6B46C1" fill-opacity="0.08" stroke="#6B46C1" stroke-width="1.5"/>
    <text x="450" y="118" font-size="14" fill="#6B46C1" font-weight="600" text-anchor="middle">Which statistic?</text>
    <text x="450" y="140" font-size="11" fill="#6B46C1" text-anchor="middle">Mean, p95 or max of tokens per input</text>
    <text x="450" y="160" font-size="10" fill="#8B5CF6" text-anchor="middle" font-style="italic">Pick by the decision, not by habit</text>
  </g>
  <line x1="450" y1="174" x2="450" y2="196" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="165" y1="196" x2="735" y2="196" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="165" y1="196" x2="165" y2="218" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="450" y1="196" x2="450" y2="218" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="735" y1="196" x2="735" y2="218" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="462" y="190" font-size="11" fill="#374151" font-weight="600">which decision?</text>
  <g>
    <rect x="40" y="218" width="250" height="200" rx="10" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1.5"/>
    <rect x="40" y="218" width="250" height="32" rx="10" fill="#4C51BF"/>
    <rect x="40" y="242" width="250" height="8" fill="#4C51BF"/>
    <text x="165" y="239" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Monthly cost</text>
    <text x="165" y="274" font-size="12" fill="#4C51BF" font-weight="600" text-anchor="middle">Use the mean</text>
    <text x="58" y="300" font-size="11" fill="#374151">1. Total tokens = mean x requests</text>
    <text x="58" y="317" font-size="11" fill="#374151">2. Total cost = total tokens / 1,000,000</text>
    <text x="72" y="334" font-size="11" fill="#374151">x price per million</text>
    <text x="58" y="351" font-size="11" fill="#374151">3. The average input drives the bill</text>
    <rect x="58" y="384" width="214" height="22" rx="4" fill="#4C51BF" fill-opacity="0.1"/>
    <text x="165" y="399" font-size="11" fill="#4C51BF" font-weight="600" text-anchor="middle">mean</text>
  </g>
  <g>
    <rect x="325" y="218" width="250" height="200" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect x="325" y="218" width="250" height="32" rx="10" fill="#059669"/>
    <rect x="325" y="242" width="250" height="8" fill="#059669"/>
    <text x="450" y="239" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Context limit failures</text>
    <text x="450" y="274" font-size="12" fill="#059669" font-weight="600" text-anchor="middle">Use max, then p95</text>
    <text x="343" y="300" font-size="11" fill="#374151">1. Compare max to the context limit</text>
    <text x="343" y="317" font-size="11" fill="#374151">2. If max fits, no request fails</text>
    <text x="343" y="334" font-size="11" fill="#374151">3. If it does not, p95 says how</text>
    <text x="357" y="351" font-size="11" fill="#374151">common the long inputs are</text>
    <rect x="343" y="384" width="214" height="22" rx="4" fill="#059669" fill-opacity="0.1"/>
    <text x="450" y="399" font-size="11" fill="#059669" font-weight="600" text-anchor="middle">max, then p95</text>
  </g>
  <g>
    <rect x="610" y="218" width="250" height="200" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="610" y="218" width="250" height="32" rx="10" fill="#B45309"/>
    <rect x="610" y="242" width="250" height="8" fill="#B45309"/>
    <text x="735" y="239" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Special handling</text>
    <text x="735" y="274" font-size="12" fill="#B45309" font-weight="600" text-anchor="middle">Use the inputs above p95</text>
    <text x="628" y="300" font-size="11" fill="#374151">1. Find the p95 token count</text>
    <text x="628" y="317" font-size="11" fill="#374151">2. Flag every input above it</text>
    <text x="628" y="334" font-size="11" fill="#374151">3. Handle that long tail separately</text>
    <text x="642" y="351" font-size="11" fill="#374151">from the typical input</text>
    <rect x="628" y="384" width="214" height="22" rx="4" fill="#B45309" fill-opacity="0.1"/>
    <text x="735" y="399" font-size="11" fill="#B45309" font-weight="600" text-anchor="middle">inputs above p95</text>
  </g>
  <rect x="60" y="444" width="780" height="100" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/>
  <text x="80" y="468" font-size="12" fill="#92400E" font-weight="600">Trip hazards</text>
  <text x="80" y="488" font-size="11" fill="#78350F">The mean hides the tail: a few very long inputs barely move it but can still break the limit.</text>
  <text x="80" y="504" font-size="11" fill="#78350F">The max is a single input; p95 tells you whether long inputs are rare or common.</text>
  <text x="80" y="520" font-size="10" fill="#B45309" font-style="italic">Report all three, then read the one that matches the decision.</text>

</svg>
