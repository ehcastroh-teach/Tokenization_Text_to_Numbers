<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'SF Pro Text', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="600" fill="#FAFAF9"/>
  <text x="450" y="40" font-size="22" fill="#1A1A1A" font-weight="600" text-anchor="middle">One sentence, three notations</text>
  <text x="450" y="62" font-size="13" fill="#6B7280" text-anchor="middle">"Tokenization isn't magic." cut by three tokenizers</text>
  <g>
    <rect x="60" y="92" width="780" height="124" rx="10" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1.5"/>
    <rect x="60" y="92" width="6" height="124" rx="3" fill="#4C51BF"/>
    <text x="90" y="122" font-size="14" fill="#4C51BF" font-weight="600">cl100k_base</text>
    <text x="816" y="122" font-size="14" fill="#4C51BF" font-weight="600" text-anchor="end">6 tokens</text>
    <rect x="90" y="138" width="54" height="30" rx="6" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1"/><text x="98" y="157.0" font-size="12" fill="#4C51BF" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">Token</text>
    <rect x="152" y="138" width="68" height="30" rx="6" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1"/><text x="160" y="157.0" font-size="12" fill="#4C51BF" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">ization</text>
    <rect x="228" y="138" width="52" height="30" rx="6" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1"/><rect x="236" y="142" width="12" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="251" y="157.0" font-size="12" fill="#4C51BF" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">isn</text>
    <rect x="288" y="138" width="32" height="30" rx="6" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1"/><text x="296" y="157.0" font-size="12" fill="#4C51BF" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">'t</text>
    <rect x="328" y="138" width="66" height="30" rx="6" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1"/><rect x="336" y="142" width="12" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="351" y="157.0" font-size="12" fill="#4C51BF" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">magic</text>
    <rect x="402" y="138" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#4C51BF" stroke-width="1"/><text x="410" y="157.0" font-size="12" fill="#4C51BF" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">.</text>
    <text x="90" y="196" font-size="11" fill="#6B7280" font-style="italic">Notation: a literal leading space (the amber block)</text>
  </g>
  <g>
    <rect x="60" y="232" width="780" height="124" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="232" width="6" height="124" rx="3" fill="#059669"/>
    <text x="90" y="262" font-size="14" fill="#059669" font-weight="600">GPT-2</text>
    <text x="816" y="262" font-size="14" fill="#059669" font-weight="600" text-anchor="end">6 tokens</text>
    <rect x="90" y="278" width="54" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="98" y="297.0" font-size="12" fill="#059669" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">Token</text>
    <rect x="152" y="278" width="68" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="160" y="297.0" font-size="12" fill="#059669" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">ization</text>
    <rect x="228" y="278" width="58" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><rect x="236" y="282" width="18" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="245.0" y="298.0" font-size="12" fill="#92400E" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">Ġ</text><text x="257" y="297.0" font-size="12" fill="#059669" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">isn</text>
    <rect x="294" y="278" width="32" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="302" y="297.0" font-size="12" fill="#059669" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">'t</text>
    <rect x="334" y="278" width="72" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><rect x="342" y="282" width="18" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="351.0" y="298.0" font-size="12" fill="#92400E" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">Ġ</text><text x="363" y="297.0" font-size="12" fill="#059669" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">magic</text>
    <rect x="414" y="278" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="422" y="297.0" font-size="12" fill="#059669" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">.</text>
    <text x="90" y="336" font-size="11" fill="#6B7280" font-style="italic">Notation: Ġ stands in for the space</text>
  </g>
  <g>
    <rect x="60" y="372" width="780" height="124" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="60" y="372" width="6" height="124" rx="3" fill="#B45309"/>
    <text x="90" y="402" font-size="14" fill="#B45309" font-weight="600">SentencePiece (300-piece model)</text>
    <text x="816" y="402" font-size="14" fill="#B45309" font-weight="600" text-anchor="end">16 tokens</text>
    <rect x="90" y="418" width="43" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><rect x="98" y="422" width="18" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="107.0" y="438.0" font-size="12" fill="#92400E" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">▁</text><text x="119" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">T</text>
    <rect x="139" y="418" width="47" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="147" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">oken</text>
    <rect x="192" y="418" width="32" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="200" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">iz</text>
    <rect x="230" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="238" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">a</text>
    <rect x="261" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="269" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">t</text>
    <rect x="292" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="300" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">i</text>
    <rect x="323" y="418" width="32" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="331" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">on</text>
    <rect x="361" y="418" width="50" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><rect x="369" y="422" width="18" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="378.0" y="438.0" font-size="12" fill="#92400E" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">▁</text><text x="390" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">is</text>
    <rect x="417" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="425" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">n</text>
    <rect x="448" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="456" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">'</text>
    <rect x="479" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="487" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">t</text>
    <rect x="510" y="418" width="43" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><rect x="518" y="422" width="18" height="22" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/><text x="527.0" y="438.0" font-size="12" fill="#92400E" font-weight="700" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">▁</text><text x="539" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">m</text>
    <rect x="559" y="418" width="32" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="567" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">ag</text>
    <rect x="597" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="605" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">i</text>
    <rect x="628" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="636" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">c</text>
    <rect x="659" y="418" width="25" height="30" rx="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1"/><text x="667" y="437.0" font-size="12" fill="#B45309" font-weight="600" font-family="'SF Mono', Menlo, Consolas, monospace">.</text>
    <text x="90" y="476" font-size="11" fill="#6B7280" font-style="italic">Notation: ▁ marks the start of each word</text>
  </g>
  <rect x="60" y="516" width="780" height="70" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/>
  <text x="80" y="540" font-size="12" fill="#92400E" font-weight="600">Key insight:</text>
  <text x="80" y="560" font-size="11" fill="#78350F">The space rides with the word after it in all three.</text>
  <text x="80" y="576" font-size="11" fill="#78350F">Only the notation differs: a leading space, Ġ, or ▁.</text>

</svg>
