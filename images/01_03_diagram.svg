<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" font-family="'SF Pro Text', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="730" fill="#FAFAF9"/>
  <text x="450" y="40" font-size="22" fill="#1A1A1A" font-weight="600" text-anchor="middle">Encoding "newest slower", then decoding it</text>
  <text x="450" y="62" font-size="13" fill="#6B7280" text-anchor="middle">Encoding applies merges in learned order; decoding is a plain lookup</text>
  <text x="110" y="102" font-size="12" fill="#2D3748" font-weight="600" text-anchor="middle">Text</text>
  <line x1="110" y1="112" x2="110" y2="588" stroke="#2D3748" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
  <text x="330" y="102" font-size="12" fill="#4C51BF" font-weight="600" text-anchor="middle">Encoder</text>
  <line x1="330" y1="112" x2="330" y2="588" stroke="#4C51BF" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
  <text x="570" y="102" font-size="12" fill="#B45309" font-weight="600" text-anchor="middle">Merge table</text>
  <line x1="570" y1="112" x2="570" y2="588" stroke="#B45309" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
  <text x="800" y="102" font-size="12" fill="#059669" font-weight="600" text-anchor="middle">Vocabulary</text>
  <line x1="800" y1="112" x2="800" y2="588" stroke="#059669" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
  <g>
    <circle cx="110" cy="140" r="14" fill="#2D3748"/>
    <text x="110" y="145" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">1</text>
    <line x1="124" y1="140" x2="310" y2="140" stroke="#2D3748" stroke-width="1.5"/>
    <polygon points="316,140 306,135 306,145" fill="#2D3748"/>
    <text x="220.0" y="132" font-size="11" fill="#374151" text-anchor="middle">newest slower</text>
    <text x="220.0" y="157" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">each word becomes letters + &lt;/w&gt;</text>
  </g>
  <g>
    <circle cx="330" cy="184" r="14" fill="#4C51BF"/>
    <text x="330" y="189" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">2</text>
    <line x1="344" y1="184" x2="550" y2="184" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="556,184 546,179 546,189" fill="#4C51BF"/>
    <text x="450.0" y="176" font-size="11" fill="#4C51BF" text-anchor="middle">apply merges in learned order</text>
    <text x="450.0" y="201" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">each word on its own</text>
  </g>
  <g>
    <circle cx="570" cy="228" r="14" fill="#B45309"/>
    <text x="570" y="233" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">3</text>
    <line x1="556" y1="228" x2="350" y2="228" stroke="#B45309" stroke-width="1.5"/>
    <polygon points="344,228 354,223 354,233" fill="#B45309"/>
    <text x="450.0" y="220" font-size="11" fill="#B45309" text-anchor="middle">['newest&lt;/w&gt;'] and ['s', 'lower&lt;/w&gt;']</text>
  </g>
  <g>
    <circle cx="330" cy="272" r="14" fill="#4C51BF"/>
    <text x="330" y="277" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">4</text>
    <line x1="344" y1="272" x2="780" y2="272" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="786,272 776,267 776,277" fill="#4C51BF"/>
    <text x="685.0" y="264" font-size="11" fill="#4C51BF" text-anchor="middle">look up each piece</text>
  </g>
  <g>
    <circle cx="800" cy="316" r="14" fill="#059669"/>
    <text x="800" y="321" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">5</text>
    <line x1="786" y1="316" x2="350" y2="316" stroke="#059669" stroke-width="1.5"/>
    <polygon points="344,316 354,311 354,321" fill="#059669"/>
    <text x="685.0" y="308" font-size="11" fill="#059669" text-anchor="middle">ids [20] and [9, 28]</text>
  </g>
  <g>
    <circle cx="330" cy="360" r="14" fill="#4C51BF"/>
    <text x="330" y="365" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">6</text>
    <line x1="316" y1="360" x2="130" y2="360" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="124,360 134,355 134,365" fill="#4C51BF"/>
    <text x="220.0" y="352" font-size="11" fill="#4C51BF" text-anchor="middle">[20, 9, 28]</text>
  </g>
  <line x1="40" y1="382" x2="860" y2="382" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="40" y="376" font-size="10" fill="#6B7280" font-weight="600">DECODE</text>
  <g>
    <circle cx="110" cy="404" r="14" fill="#2D3748"/>
    <text x="110" y="409" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">7</text>
    <line x1="124" y1="404" x2="310" y2="404" stroke="#2D3748" stroke-width="1.5"/>
    <polygon points="316,404 306,399 306,409" fill="#2D3748"/>
    <text x="220.0" y="396" font-size="11" fill="#374151" text-anchor="middle">decode [20, 9, 28]</text>
  </g>
  <g>
    <circle cx="330" cy="448" r="14" fill="#4C51BF"/>
    <text x="330" y="453" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">8</text>
    <line x1="344" y1="448" x2="780" y2="448" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="786,448 776,443 776,453" fill="#4C51BF"/>
    <text x="685.0" y="440" font-size="11" fill="#4C51BF" text-anchor="middle">id -&gt; piece, one lookup each</text>
  </g>
  <g>
    <circle cx="800" cy="492" r="14" fill="#059669"/>
    <text x="800" y="497" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">9</text>
    <line x1="786" y1="492" x2="350" y2="492" stroke="#059669" stroke-width="1.5"/>
    <polygon points="344,492 354,487 354,497" fill="#059669"/>
    <text x="685.0" y="484" font-size="11" fill="#059669" text-anchor="middle">'newest&lt;/w&gt;', 's', 'lower&lt;/w&gt;'</text>
  </g>
  <g>
    <circle cx="330" cy="536" r="14" fill="#4C51BF"/>
    <text x="330" y="541" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">10</text>
    <line x1="316" y1="536" x2="130" y2="536" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="124,536 134,531 134,541" fill="#4C51BF"/>
    <text x="220.0" y="528" font-size="11" fill="#4C51BF" text-anchor="middle">newest slower</text>
    <text x="220.0" y="553" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">join pieces; &lt;/w&gt; becomes a space</text>
  </g>
  <text x="40" y="134" font-size="10" fill="#6B7280" font-weight="600">ENCODE</text>
  <rect x="80" y="616" width="740" height="100" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/>
  <text x="100" y="640" font-size="12" fill="#92400E" font-weight="600">Why it round-trips</text>
  <text x="100" y="660" font-size="11" fill="#78350F">Encoding searches: the merges must be applied in the order they were learned.</text>
  <text x="100" y="676" font-size="11" fill="#78350F">Decoding only looks up: each id maps to exactly one piece, so the original text always comes back.</text>
  <text x="100" y="692" font-size="10" fill="#B45309" font-style="italic">newest slower -&gt; ['newest&lt;/w&gt;', 's', 'lower&lt;/w&gt;'] -&gt; [20, 9, 28] -&gt; newest slower</text>

</svg>
